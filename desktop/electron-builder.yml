# F12-1 打包配置（NSIS + 后端 sidecar）
# 后端产物：resources/backend/pkb-backend.exe（PyInstaller），由 B13 的打包脚本产出。
appId: com.personal.pkb
productName: PersonalKnowledgeBase
copyright: Personal use only
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
extraResources:
  # 后端 sidecar（PyInstaller，构建时由 npm run stage:artifacts 暂存）
  - from: build/backend/pkb-backend
    to: backend
    filter:
      - '**/*'
  # 离线嵌入模型（F13，构建时暂存并校验 sha256）
  - from: build/models/bge-small-zh-v1.5
    to: models/bge-small-zh-v1.5
    filter:
      - '**/*'
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 个人知识库
  deleteAppDataOnUninstall: false
