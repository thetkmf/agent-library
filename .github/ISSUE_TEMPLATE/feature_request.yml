name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请说明使用场景与期望价值，而不是只描述实现方式。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你现在遇到什么困难？这个功能会帮助谁？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      multiple: true
      options:
        - 笔记 / 编辑器
        - 文件
        - 检索 / 索引
        - AI 对话 / 任务
        - 提醒
        - 学习计划
        - 知识图谱
        - 设置 / 隐私
        - 安装 / 打包
        - 文档
        - 其他

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，未发现重复
          required: true
