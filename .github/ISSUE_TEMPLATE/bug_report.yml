name: Bug 报告
description: 报告可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索是否已有相同 Issue。

        **请勿粘贴 API Key、访问 token、个人数据或未脱敏日志。** 安全漏洞请走 [私密报告](../security/advisories/new)。

  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 设置页 / 安装包文件名中的版本，例如 0.1.0-beta.1
      placeholder: "0.1.0-beta.1"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Windows 版本
      options:
        - Windows 11
        - Windows 10
        - Windows Server
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开…
        2. 点击…
        3. 看到…
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 日志位于 `%APPDATA%\PersonalKnowledgeBase\logs\`。粘贴前请移除 token、`sk-` 开头密钥与个人内容。
      render: text
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，未发现重复
          required: true
        - label: 我已移除日志中的密钥、token 与个人数据
          required: true
