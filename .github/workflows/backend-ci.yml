name: backend-ci

on:
  push:
    branches: ["main", "lwc/**", "feat/**", "fix/**"]
    paths:
      - "backend/**"
      - "scripts/export_openapi.py"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "scripts/export_openapi.py"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Types
        run: mypy app
      - name: Tests
        run: pytest
      - name: Contract
        run: python ../scripts/export_openapi.py --check
